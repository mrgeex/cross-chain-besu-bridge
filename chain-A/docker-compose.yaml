x-besu-common: &besu-common
  image: hyperledger/besu:26.2.0
  restart: unless-stopped
  command:
    - --genesis-file=/config/genesis.json
    - --data-path=/var/lib/besu
    - --node-private-key-file=/keys/priv_key
    - --static-nodes-file=/config/static-nodes.json
    - --discovery-enabled=false
    - --p2p-host=0.0.0.0
    - --p2p-port=30303
    - --permissions-nodes-config-file-enabled=true
    # - --permissions-accounts-config-file-enabled=true
    - --rpc-http-enabled=true
    - --rpc-http-host=0.0.0.0
    - --rpc-http-port=8545
    - --rpc-http-api=ETH,NET,WEB3,QBFT,ADMIN,PERM
    - --rpc-http-cors-origins=all
    - --rpc-ws-enabled=true
    - --rpc-ws-host=0.0.0.0
    - --rpc-ws-port=8546
    - --rpc-ws-api=ETH,NET,WEB3,QBFT
    - --host-allowlist=all
    - --min-gas-price=0
    - --revert-reason-enabled=true
  networks:
    - chain-a-qbft

services:
  chain-a-validator-1:
    <<: *besu-common
    container_name: chain-a-validator-1
    volumes:
      - chain-a-validator-1-data:/var/lib/besu
      - ./networkFiles/genesis.json:/config/genesis.json:ro
      - ./static-nodes.json:/config/static-nodes.json:ro
      - ./permissions_config.toml:/var/lib/besu/permissions_config.toml
      - ./networkFiles/nodes/validator-1:/keys:ro
    ports:
      - "18545:8545"
      - "18546:8546"
    #      - "31303:31303/tcp"
    #      - "31303:31303/udp"
    networks:
      chain-a-qbft:
        ipv4_address: 172.28.0.11

  chain-a-validator-2:
    <<: *besu-common
    container_name: chain-a-validator-2
    volumes:
      - chain-a-validator-2-data:/var/lib/besu
      - ./networkFiles/genesis.json:/config/genesis.json:ro
      - ./static-nodes.json:/config/static-nodes.json:ro
      - ./permissions_config.toml:/var/lib/besu/permissions_config.toml
      - ./networkFiles/nodes/validator-2:/keys:ro
    networks:
      chain-a-qbft:
        ipv4_address: 172.28.0.12

  chain-a-validator-3:
    <<: *besu-common
    container_name: chain-a-validator-3
    volumes:
      - chain-a-validator-3-data:/var/lib/besu
      - ./networkFiles/genesis.json:/config/genesis.json:ro
      - ./static-nodes.json:/config/static-nodes.json:ro
      - ./permissions_config.toml:/var/lib/besu/permissions_config.toml
      - ./networkFiles/nodes/validator-3:/keys:ro
    networks:
      chain-a-qbft:
        ipv4_address: 172.28.0.13

  chain-a-validator-4:
    <<: *besu-common
    container_name: chain-a-validator-4
    volumes:
      - chain-a-validator-4-data:/var/lib/besu
      - ./networkFiles/genesis.json:/config/genesis.json:ro
      - ./static-nodes.json:/config/static-nodes.json:ro
      - ./permissions_config.toml:/var/lib/besu/permissions_config.toml
      - ./networkFiles/nodes/validator-4:/keys:ro
    networks:
      chain-a-qbft:
        ipv4_address: 172.28.0.14

networks:
  chain-a-qbft:
    name: chain-a-qbft
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  chain-a-validator-1-data:
  chain-a-validator-2-data:
  chain-a-validator-3-data:
  chain-a-validator-4-data:
